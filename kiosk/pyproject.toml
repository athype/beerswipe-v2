[project]
name = "beerswipe-kiosk"
version = "0.1.0"
description = "A kiosk application for the Beerswipe system for the raspberry Pi"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "kivy>=2.3.1",
    "pydantic>=2.13.4",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "ruff>=0.15.21",
    "types-pyserial>=3.5",
]

[tool.mypy]
# kivy ships no type info (no py.typed marker); treat it as Any. This is
# also why src/ui is not part of the --strict mypy run.
[[tool.mypy.overrides]]
module = "kivy.*"
ignore_missing_imports = true
